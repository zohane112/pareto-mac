<!doctype html>
<!-- The picture behind the installer window. Finder puts the icons on top of it:
     the app at (160, 205), Applications at (480, 205), READ ME FIRST at (320, 360).
     Finder writes the icon names in black in light mode and white in dark mode, so the
     ground is a mid grey that both can be read on, and the steps sit on light pills.
     make.sh turns this into background.png and @2x. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DSEG7"; src: url(../Resources/Fonts/DSEG7Classic-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Geist Mono"; src: url(../Resources/Fonts/GeistMono-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Geist Mono"; src: url(../Resources/Fonts/GeistMono-Medium.ttf); font-weight: 500; }
  html, body { margin: 0; width: 640px; height: 470px; overflow: hidden; }
  body {
    position: relative;
    background-color: #7a7a75;
    background-image: linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 16px 16px;
    font-family: "Geist Mono", ui-monospace, Menlo, monospace;
    color: #0c0c0c;
  }
  .mark { position: absolute; left: 22px; top: 18px; display: flex; align-items: flex-end; gap: 7px; }
  .word { position: relative; font: 700 18px/1 "DSEG7", monospace; color: #f6f6f3; }
  .word .ghost { position: absolute; left: 0; top: 0; color: rgba(246, 246, 243, 0.18); }
  .word span:last-child { position: relative; }
  .light { width: 6px; height: 6px; border-radius: 50%; background: #f5a000; box-shadow: 0 0 0 2px rgba(245, 160, 0, 0.25); margin-bottom: 1px; }
  .step {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    background: #f6f6f3; border: 1px solid #cfcfc9; border-radius: 999px;
    padding: 7px 16px 7px 12px; font-weight: 500;
    box-shadow: 0 8px 22px rgba(12, 12, 12, 0.18);
  }
  .one { top: 62px; font-size: 15px; }
  .two { top: 286px; font-size: 13px; }
  .n { font: 700 17px/1 "DSEG7", monospace; }
  .two .n { font-size: 15px; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <div class="mark"><span class="word"><span class="ghost">888888</span><span>Pareto</span></span><span class="light"></span></div>
  <div class="step one"><span class="n">1</span>Drag Pareto onto Applications</div>
  <!-- The arrow, in short segments like a level meter. -->
  <svg width="640" height="470" viewBox="0 0 640 470">
    <g fill="#f6f6f3">
      <rect x="236" y="202" width="12" height="6" rx="1"/>
      <rect x="254" y="202" width="12" height="6" rx="1"/>
      <rect x="272" y="202" width="12" height="6" rx="1"/>
      <rect x="290" y="202" width="12" height="6" rx="1"/>
      <rect x="308" y="202" width="12" height="6" rx="1"/>
      <rect x="326" y="202" width="12" height="6" rx="1"/>
      <rect x="344" y="202" width="12" height="6" rx="1"/>
      <rect x="362" y="202" width="12" height="6" rx="1"/>
      <rect x="380" y="202" width="12" height="6" rx="1"/>
      <path d="M396 192 L410 205 L396 218 Z"/>
    </g>
  </svg>
  <div class="step two"><span class="n">2</span>Then double-click READ ME FIRST</div>
</body>
</html>
